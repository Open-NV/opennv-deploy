name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/ruff-action@v3
      - name: Check Python
        run: ruff check scripts tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
